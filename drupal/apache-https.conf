# Railway terminates TLS at its edge and forwards the original scheme via the
# X-Forwarded-Proto header. Propagate that to PHP so Drupal emits https://
# links and cookies. Applies at server scope; Drupal's per-directory
# .htaccess rules are unaffected.
RewriteEngine On
RewriteCond %{HTTP:X-Forwarded-Proto} =https
RewriteRule .* - [E=HTTPS:on]
